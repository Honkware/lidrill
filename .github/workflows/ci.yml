name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # tsc -b, then the Vite build
      - run: bun run build
      - run: bun run test
      - run: bun run gate:offline

  # The site and the Worker go out once main passes. The Maia server is
  # updated by hand (git pull and a restart): it runs on a separate VM
  # reached over SSH, and a restart interrupts the requests in flight for a
  # few seconds. It keeps no game state, so a game carries on when the
  # browser asks again.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A newer push waits for the deploy before it instead of racing it
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
