<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
	<defs>
		<pattern id="checker" width="200" height="200" patternUnits="userSpaceOnUse">
			<rect x="100" width="100" height="100" fill="#fff"/>
			<rect y="100" width="100" height="100" fill="#fff"/>
		</pattern>
		<mask id="dark">
			<rect width="800" height="800" fill="url(#checker)"/>
		</mask>
		<filter id="maple" x="0" y="0" width="100%" height="100%">
			<feTurbulence type="fractalNoise" baseFrequency="0.004 0.09" numOctaves="3" seed="4"/>
			<feColorMatrix values="0 0 0 0.16 0.80  0 0 0 0.14 0.66  0 0 0 0.10 0.47  0 0 0 0 1"/>
		</filter>
		<filter id="walnut" x="0" y="0" width="100%" height="100%">
			<feTurbulence type="fractalNoise" baseFrequency="0.005 0.11" numOctaves="3" seed="9"/>
			<feColorMatrix values="0 0 0 0.24 0.27  0 0 0 0.16 0.16  0 0 0 0.10 0.09  0 0 0 0 1"/>
		</filter>
	</defs>
	<rect width="800" height="800" filter="url(#maple)"/>
	<rect width="800" height="800" filter="url(#walnut)" mask="url(#dark)"/>
</svg>
